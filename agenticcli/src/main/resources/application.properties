spring.application.name=youtubeCLI
spring.main.web-application-type = none
spring.shell.script.enabled=false
spring.shell.interactive.enabled=false

github.token={YOUR_GITHUB_TOKEN}
Gemini.API.Key={YOUR_AI_API_KEY}

# Quiet CLI output: only errors, no banner or startup info.
logging.level.root=ERROR
# Failures are reported by AgentApplication.main; don't also dump the stack trace.
logging.level.org.springframework.boot.SpringApplication=OFF

spring.main.banner-mode=off
spring.main.log-startup-info=false
